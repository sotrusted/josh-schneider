{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-6 py-14">

  <header class="mb-10 border-b border-neutral-800 pb-8">
    <h1 class="font-serif text-3xl sm:text-4xl text-neutral-100 mb-2">{{ page.title }}</h1>
  </header>

  {% if page.hero_image %}
  <div class="mb-10">
    <img src="{{ page.hero_image.url }}" alt="{{ page.title }}"
         class="w-full max-w-2xl object-cover">
    {% if page.hero_image_caption %}
    <p class="text-xs text-neutral-600 mt-2">{{ page.hero_image_caption }}</p>
    {% endif %}
  </div>
  {% endif %}

  <div class="prose-content text-neutral-300 leading-relaxed max-w-2xl">
    {{ page.content|safe }}
  </div>

</div>
{% endblock %}
